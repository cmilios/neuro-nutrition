project_id = "cmayisxvronrwvzhyuer"

[auth]
site_url = "http://localhost:3000/neuro-nutrition/"
additional_redirect_urls = [
  "http://localhost:3000/neuro-nutrition/recover-password",
  "http://127.0.0.1:3000/neuro-nutrition/recover-password",
  "https://cmilios.github.io/neuro-nutrition/recover-password",
]
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
secure_password_change = true

[functions.generate-meal-plan]
# Authentication is enforced inside the function. This also permits the
# separate hashed monitoring credential on its GET-only release endpoint.
verify_jwt = false

[functions.weekly-plan-observation]
# The function verifies a dedicated high-entropy bearer token by hash before
# accessing any probe. Supabase API keys are never exposed to the runner.
verify_jwt = false

[functions.client-incident-alert]
# Necessarily anonymous: this is the fallback for telemetry that could not reach
# the database, and `navigator.sendBeacon` cannot attach an Authorization
# header. It reads no data and writes nothing to the database — it validates a
# closed payload shape and emits one log line — so there is no authority to
# protect. Abuse is bounded by a body-size limit and a per-minute cap.
verify_jwt = false
