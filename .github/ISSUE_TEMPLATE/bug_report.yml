name: Bug report
description: Report an ordinary, reproducible NeuroNutrition problem without private data
title: "[Bug]: "
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NeuroNutrition. This is a public issue.

        **Do not include Health Profile data, email addresses, tokens, authorization codes, raw provider errors, or sensitive screenshots.** Do not paste recovery or confirmation links. Report a safe app message instead of console or provider payloads.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sign in or account access
        - Account or settings
        - Health Profile
        - Weekly Plan
        - Documentation
        - Other ordinary app behavior
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Describe the task without personal, health, or authentication details.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Safe reproduction steps
      description: Start from a public page and replace private values with neutral placeholders.
      placeholder: |
        1. Opened …
        2. Selected …
        3. Saw the safe in-app message …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Quote only a sanitized message displayed by NeuroNutrition.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Firefox 141 on Windows 11
    validations:
      required: true

  - type: input
    id: timing
    attributes:
      label: Approximate time and time zone
      description: This helps correlate a failure without identifying your account.
      placeholder: 2026-08-09 around 14:30 UTC

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I removed private, health, authentication, provider, and sensitive screenshot data from this report.
          required: true
