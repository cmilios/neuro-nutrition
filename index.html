<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

  <!-- Open Graph / Social Media Meta Tags -->
  <meta property="og:title" content="NeuroNutrition - AI Meal Planner" />
  <meta property="og:description"
    content="Generated personalized meal plans powered by AI. Manage your nutrition, track performance, and achieve your goals with NeuroNutrition." />
  <meta property="og:image" content="https://cmilios.github.io/neuro-nutrition/og-image.png" />
  <meta property="og:url" content="https://cmilios.github.io/neuro-nutrition/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>NeuroNutrition - AI Meal Planner</title>
  <script>
    (() => {
      try {
        const preference = localStorage.getItem('neuro-nutrition-theme') || 'system';
        const dark = preference === 'dark'
          || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch {
        // The application initializer will apply the system preference.
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
    }

    /* Custom Scrollbar for sleek look */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
