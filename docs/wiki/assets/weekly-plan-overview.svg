<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Synthetic NeuroNutrition Weekly Plan for Monday</title>
  <desc id="description">A synthetic example with four meal cards: berry oat bowl, lemon herb grain bowl, lentil vegetable skillet, and apple yogurt cup. A header shows daily nutrition targets.</desc>
  <defs>
    <linearGradient id="summary" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="56" y="42" width="1088" height="186" rx="22" fill="url(#summary)" filter="url(#shadow)"/>
  <text x="92" y="88" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Weekly Plan overview</text>
  <text x="92" y="122" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">Synthetic example · balanced meals with varied whole-food ingredients</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 150)"><rect width="220" height="52" rx="12" fill="#ffffff" fill-opacity="0.10"/><text x="16" y="21" fill="#94a3b8" font-size="11" font-weight="700">CALORIES</text><text x="16" y="42" fill="#ffffff" font-size="18" font-weight="700">1,860 kcal</text></g>
    <g transform="translate(330 150)"><rect width="220" height="52" rx="12" fill="#ffffff" fill-opacity="0.10"/><text x="16" y="21" fill="#94a3b8" font-size="11" font-weight="700">PROTEIN</text><text x="16" y="42" fill="#ffffff" font-size="18" font-weight="700">112 g</text></g>
    <g transform="translate(568 150)"><rect width="220" height="52" rx="12" fill="#ffffff" fill-opacity="0.10"/><text x="16" y="21" fill="#94a3b8" font-size="11" font-weight="700">CARBS</text><text x="16" y="42" fill="#ffffff" font-size="18" font-weight="700">205 g</text></g>
    <g transform="translate(806 150)"><rect width="220" height="52" rx="12" fill="#ffffff" fill-opacity="0.10"/><text x="16" y="21" fill="#94a3b8" font-size="11" font-weight="700">FATS</text><text x="16" y="42" fill="#ffffff" font-size="18" font-weight="700">61 g</text></g>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <rect x="56" y="252" width="104" height="42" rx="21" fill="#059669"/><text x="83" y="279" fill="#ffffff">Monday</text>
    <rect x="172" y="252" width="104" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1"/><text x="198" y="279" fill="#64748b">Tuesday</text>
    <rect x="288" y="252" width="122" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1"/><text x="313" y="279" fill="#64748b">Wednesday</text>
  </g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(56 322)"><rect width="526" height="154" rx="18" fill="#ffffff" stroke="#e2e8f0"/><path d="M18 0h490a18 18 0 0 1 18 18v30H0V18A18 18 0 0 1 18 0z" fill="#ecfdf5"/><text x="24" y="31" fill="#047857" font-size="13" font-weight="700">BREAKFAST · 15 MIN</text><text x="24" y="82" fill="#0f172a" font-size="21" font-weight="700">Berry Oat Bowl</text><text x="24" y="110" fill="#475569" font-size="14">Rolled oats, berries, yogurt, chia seeds, cinnamon</text><text x="24" y="137" fill="#64748b" font-size="13">420 kcal · 24 g protein</text></g>
    <g transform="translate(618 322)"><rect width="526" height="154" rx="18" fill="#ffffff" stroke="#e2e8f0"/><path d="M18 0h490a18 18 0 0 1 18 18v30H0V18A18 18 0 0 1 18 0z" fill="#fffbeb"/><text x="24" y="31" fill="#b45309" font-size="13" font-weight="700">LUNCH · 25 MIN</text><text x="24" y="82" fill="#0f172a" font-size="21" font-weight="700">Lemon Herb Grain Bowl</text><text x="24" y="110" fill="#475569" font-size="14">Quinoa, chickpeas, cucumber, herbs, lemon dressing</text><text x="24" y="137" fill="#64748b" font-size="13">510 kcal · 28 g protein</text></g>
    <g transform="translate(56 510)"><rect width="526" height="154" rx="18" fill="#ffffff" stroke="#e2e8f0"/><path d="M18 0h490a18 18 0 0 1 18 18v30H0V18A18 18 0 0 1 18 0z" fill="#eef2ff"/><text x="24" y="31" fill="#4338ca" font-size="13" font-weight="700">DINNER · 35 MIN</text><text x="24" y="82" fill="#0f172a" font-size="21" font-weight="700">Lentil Vegetable Skillet</text><text x="24" y="110" fill="#475569" font-size="14">Lentils, tomatoes, spinach, peppers, brown rice</text><text x="24" y="137" fill="#64748b" font-size="13">620 kcal · 39 g protein</text></g>
    <g transform="translate(618 510)"><rect width="526" height="154" rx="18" fill="#ffffff" stroke="#e2e8f0"/><path d="M18 0h490a18 18 0 0 1 18 18v30H0V18A18 18 0 0 1 18 0z" fill="#fff1f2"/><text x="24" y="31" fill="#be123c" font-size="13" font-weight="700">SNACK · 5 MIN</text><text x="24" y="82" fill="#0f172a" font-size="21" font-weight="700">Apple Yogurt Cup</text><text x="24" y="110" fill="#475569" font-size="14">Apple, plain yogurt, walnuts, cinnamon</text><text x="24" y="137" fill="#64748b" font-size="13">310 kcal · 21 g protein</text></g>
  </g>
